services:
  convert-c:
    build:
      context: ./server
      args:
        TF_VERSION: ${TF_VERSION:-4.47.1}
    container_name: hop4_convert_c_${STACK_TAG:-vuln}
    environment:
      SECRET_PATH: /etc/run-secrets/keras_session
    ports:
      - "${HOST_PORT:-17881}:8080"
    networks: [net0]

  attacker:
    build: ./attacker
    container_name: hop4_attacker_${STACK_TAG:-vuln}
    environment:
      ATTACKER_HOST: hop4_attacker_${STACK_TAG:-vuln}
      LOOT_PATH: /etc/run-secrets/keras_session
    networks: [net0]
    command: sleep infinity

networks:
  net0: {}
